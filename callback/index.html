<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipsFactory — Authorization</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff0050'/%3E%3Cstop offset='1' stop-color='%2300f2ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05070c; --panel:#0d1119; --line:#1d2534;
    --paper:#f2f4fa; --dim:#8a93a9; --rose:#ff0050; --cyan:#00f2ea; --ok:#2ee87e;
    --display:'Unbounded',sans-serif; --body:'Instrument Sans',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--body);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
       min-height:100vh;display:grid;place-items:center;padding:24px}
  ::selection{background:var(--rose);color:#fff}
  .card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);
        border-radius:20px;padding:40px 36px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:11px;font-family:var(--display);
         font-weight:800;font-size:15px;margin-bottom:30px}
  .logo{width:30px;height:30px;border-radius:8px;flex:none;position:relative;
        background:linear-gradient(135deg,var(--rose),var(--cyan))}
  .logo::after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;
        border-left:9px solid #fff;border-top:6px solid transparent;
        border-bottom:6px solid transparent;transform:translateX(1px)}
  .status{font-family:var(--mono);font-size:12px;letter-spacing:2px;margin-bottom:16px}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--rose)}
  h1{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.2px;
     margin-bottom:10px}
  .lead{color:var(--dim);font-size:14px;margin-bottom:24px}
  .code-box{background:var(--ink);border:1px dashed #35405a;border-radius:12px;
        padding:18px 16px;margin:0 0 18px;font-family:var(--mono);font-size:14px;
        word-break:break-all;color:var(--cyan);text-align:left;line-height:1.5}
  button{background:linear-gradient(135deg,var(--rose),#ff4d7e);color:#fff;border:0;
        padding:13px 28px;border-radius:999px;font-size:14px;font-weight:600;
        font-family:var(--body);cursor:pointer;
        transition:transform .12s ease,box-shadow .12s ease}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(255,0,80,.6)}
  button.copied{background:rgba(46,232,126,.15);color:var(--ok);
        box-shadow:none;transform:none}
  .hint{color:var(--dim);font-size:13px;margin-top:20px}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <span class="brand"><span class="logo"></span>ClipsFactory</span>
    <div id="result">
      <div class="status">READING CODE…</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const div = document.getElementById("result");
    if (code) {
      div.innerHTML =
        '<div class="status ok">✓ AUTHORIZATION SUCCESSFUL</div>' +
        '<h1>One last step</h1>' +
        '<p class="lead">Copy this code back into the ClipsFactory app:</p>' +
        '<div class="code-box" id="code"></div>' +
        '<button id="copy-btn">Copy code</button>' +
        '<p class="hint">You can now return to the ClipsFactory desktop app.</p>';
      document.getElementById("code").textContent = code;
      const btn = document.getElementById("copy-btn");
      btn.addEventListener("click", () => {
        navigator.clipboard.writeText(code).then(() => {
          btn.textContent = "Copied ✓";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy code";
            btn.classList.remove("copied");
          }, 2500);
        });
      });
    } else if (error) {
      div.innerHTML =
        '<div class="status err">✕ AUTHORIZATION FAILED</div>' +
        '<h1>Something went wrong</h1>' +
        '<p class="lead" id="err-msg"></p>' +
        '<p class="hint">Close this tab and try connecting again from the app.</p>';
      document.getElementById("err-msg").textContent = "TikTok returned: " + error;
    } else {
      div.innerHTML =
        '<div class="status">NO CODE FOUND</div>' +
        '<p class="lead">No authorization code in this URL. Start the connection from the ClipsFactory app.</p>';
    }
  </script>
</body>
</html>
